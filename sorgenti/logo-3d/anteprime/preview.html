<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>logo · metallo grezzo</title><style>*{box-sizing:border-box}body{margin:0;background:#141414;color:#c9c5c0;font:15px system-ui}canvas{display:block;width:100%;height:82vh}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}button{background:transparent;border:1px solid #777;color:inherit;border-radius:30px;padding:10px 16px;cursor:pointer}button:hover,button:focus-visible{background:#c9c5c0;color:#141414}p{text-align:center;margin:6px}#status{font-size:12px;color:#aaa}</style><canvas id="view"></canvas><nav id="controls"><button data-clip="live">segui il cursore</button></nav><p id="status">caricamento del modello…</p><script type="module">
import * as T from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.AgXToneMapping;renderer.toneMappingExposure=1.1
const scene=new T.Scene();scene.background=new T.Color('#141414');const camera=new T.PerspectiveCamera(33,1,.1,100);camera.position.set(.4,.2,7);camera.lookAt(0,0,0)
const env=await new RGBELoader().loadAsync('../textures/studio_small_08_1k.hdr');env.mapping=T.EquirectangularReflectionMapping;scene.environment=env;scene.environmentIntensity=.9
const gltf=await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('../Logo3DAnimabile_Web.glb');scene.add(gltf.scene)
const mixer=new T.AnimationMixer(gltf.scene),head=gltf.scene.getObjectByName('testa'),clock=new T.Clock();let live=true,lastMove=performance.now(),nextBlink=performance.now()+3500,blinkAt=-1;const pointer=new T.Vector2();const bases={}
for(const side of ['sx','dx'])bases[side]=gltf.scene.getObjectByName('sguardo_'+side).position.clone()
function key(name,key,value){const obj=gltf.scene.getObjectByName(name);obj.morphTargetInfluences[obj.morphTargetDictionary[key]]=value}
function reset(){mixer.stopAllAction();head.rotation.set(0,0,0);for(const side of ['sx','dx']){key('palpebra_'+side,'chiusura',0);key('palpebra_'+side,'apertura',0);key('pupilla_'+side,'chiusura',0);gltf.scene.getObjectByName('sguardo_'+side).position.copy(bases[side])}key('sorriso','sorriso_ampio',0)}
for(const clip of gltf.animations){const b=document.createElement('button');b.dataset.clip=clip.name;b.textContent=clip.name.replaceAll('_',' ');document.querySelector('nav').append(b)}
document.querySelector('nav').addEventListener('click',e=>{const name=e.target.dataset.clip;if(!name)return;reset();live=name==='live';lastMove=performance.now();if(!live){const clip=T.AnimationClip.findByName(gltf.animations,name);mixer.clipAction(clip).setLoop(T.LoopRepeat,Infinity).play()}document.querySelector('#status').textContent=live?'sguardo interattivo · si addormenta dopo 8 secondi':'animazione: '+name})
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));lastMove=performance.now()})
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();document.querySelector('#status').textContent='sguardo interattivo · si addormenta dopo 8 secondi'
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.1),now=performance.now();if(live){let sleep=Math.min(1,Math.max(0,(now-lastMove-8000)/1300));if(now>nextBlink&&sleep===0){blinkAt=now;nextBlink=now+3500+Math.random()*3000}const phase=(now-blinkAt)/260;const blink=blinkAt>=0&&phase<1?Math.sin(phase*Math.PI):0;const close=Math.max(sleep,blink);head.rotation.y=T.MathUtils.damp(head.rotation.y,pointer.x*.12*(1-sleep),7,dt);head.rotation.x=T.MathUtils.damp(head.rotation.x,-pointer.y*.07*(1-sleep)+sleep*.1,7,dt);for(const side of ['sx','dx']){const eye=gltf.scene.getObjectByName('sguardo_'+side);eye.position.x=T.MathUtils.damp(eye.position.x,bases[side].x+pointer.x*.09*(1-sleep),8,dt);eye.position.y=T.MathUtils.damp(eye.position.y,bases[side].y+pointer.y*.05*(1-sleep),8,dt);key('palpebra_'+side,'chiusura',close);key('pupilla_'+side,'chiusura',close)}}else mixer.update(dt);renderer.render(scene,camera)})
window.logoPreview={ready:true,clips:gltf.animations.map(c=>({name:c.name,duration:c.duration})),meshes:[]};gltf.scene.traverse(o=>{if(o.isMesh)window.logoPreview.meshes.push(o.name)})
</script></html>
